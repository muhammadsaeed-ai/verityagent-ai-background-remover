    <g fill="#d9edff">
      <text x="72" y="84"><tspan fill="#cf9bff">from</tspan> background_remover <tspan fill="#cf9bff">import</tspan> (</text>
      <text x="92" y="111">remove_background,</text>
      <text x="92" y="138">replace_background_with_solid_color,</text>
      <text x="92" y="165">save_image,</text>
      <text x="72" y="192">)</text>
      <text x="72" y="235" fill="#57df84"># 01 · isolate the subject</text>
      <text x="72" y="262">foreground = <tspan fill="#54dfff">remove_background</tspan>(</text>
      <text x="92" y="289" fill="#ffdf79">"product-photo.jpg"</text>
      <text x="72" y="316">)</text>
      <text x="72" y="343" fill="#728da6"># alpha channel preserved</text>
      <text x="72" y="386" fill="#57df84"># 02 · choose a new finish</text>
      <text x="72" y="413">result = <tspan fill="#54dfff">replace_background_with_solid_color</tspan>(</text>
      <text x="92" y="440">foreground, <tspan fill="#ffdf79">"#00C8FF"</tspan></text>
      <text x="72" y="467">)</text>
      <text x="72" y="494" fill="#728da6"># or use a custom background image</text>
      <text x="72" y="537" fill="#57df84"># 03 · export crisp PNG</text>
      <text x="72" y="564"><tspan fill="#54dfff">save_image</tspan>(</text>
      <text x="92" y="591">result, <tspan fill="#ffdf79">"outputs/product.png"</tspan></text>
      <text x="72" y="618">)</text>
      <text x="72" y="645" fill="#728da6"># local processing · no API key</text>
      <text x="72" y="688"><tspan fill="#cf9bff">if</tspan> output_path.exists():</text>
      <text x="92" y="715"><tspan fill="#54dfff">print</tspan>(<tspan fill="#ffdf79">"Background removed."</tspan>)</text>
      <text x="72" y="742" fill="#57df84"># ready for your own workflow</text>
      <text x="72" y="769"><tspan fill="#54dfff">print</tspan>(<tspan fill="#ffdf79">"Export complete."</tspan>)</text>
      <text x="72" y="796" fill="#57df84"># powered by VerityAgent</text>
    </g>
