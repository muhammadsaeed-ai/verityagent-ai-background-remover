<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="430" viewBox="0 0 1300 430" role="img" aria-labelledby="title desc">
  <title id="title">Cutout Studio request and processing architecture</title>
  <desc id="desc">The browser interface sends an image to a local Flask API, which validates it, runs rembg with U2-Net, composites the requested background with Pillow, and returns a PNG response.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151f29"/><stop offset="1" stop-color="#0d141c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a4f2ce"/><stop offset="1" stop-color="#72d5a9"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6Z" fill="#8be6ba"/></marker>
  </defs>
  <rect width="1300" height="430" rx="20" fill="#0a0e14"/>
  <path d="M0 69H1300" stroke="#26323b"/>
  <text x="40" y="37" fill="#9ef5ce" font-family="monospace" font-size="11" letter-spacing="2">SYSTEM MAP / 001</text>
  <text x="40" y="56" fill="#dce6e2" font-family="Arial,sans-serif" font-size="17" font-weight="700">A local-first image pipeline</text>
  <g transform="translate(38 112)">
    <rect width="220" height="154" rx="12" fill="url(#surface)" stroke="#3d514d"/>
    <rect x="16" y="15" width="31" height="31" rx="8" fill="#20372f" stroke="#46685a"/>
    <path d="M25 30h13m-6.5-6.5v13" stroke="#9ef5ce" stroke-width="1.6" stroke-linecap="round"/>
    <text x="16" y="69" fill="#e2ebe7" font-family="Arial,sans-serif" font-size="16" font-weight="700">Browser studio</text>
    <text x="16" y="91" fill="#91a3a8" font-family="Arial,sans-serif" font-size="12">HTML · CSS · JavaScript</text>
    <path d="M16 109H204" stroke="#2d3a42"/>
    <text x="16" y="130" fill="#9ef5ce" font-family="monospace" font-size="10">UPLOAD + MODE + EXPORT</text>
  </g>
  <path d="M267 189H306" stroke="#8be6ba" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(316 112)">
    <rect width="220" height="154" rx="12" fill="url(#surface)" stroke="#3d514d"/>
    <rect x="16" y="15" width="31" height="31" rx="8" fill="#20372f" stroke="#46685a"/>
    <path d="M24 25h15v12H24zM28 21h7" fill="none" stroke="#9ef5ce" stroke-width="1.5"/>
    <text x="16" y="69" fill="#e2ebe7" font-family="Arial,sans-serif" font-size="16" font-weight="700">Flask API</text>
    <text x="16" y="91" fill="#91a3a8" font-family="Arial,sans-serif" font-size="12">Local request boundary</text>
    <path d="M16 109H204" stroke="#2d3a42"/>
    <text x="16" y="130" fill="#9ef5ce" font-family="monospace" font-size="10">VALIDATE INPUTS</text>
  </g>
  <path d="M545 189H584" stroke="#8be6ba" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(594 112)">
    <rect width="220" height="154" rx="12" fill="url(#surface)" stroke="#3d514d"/>
    <rect x="16" y="15" width="31" height="31" rx="8" fill="#20372f" stroke="#46685a"/>
    <path d="M23 37 30 22l7 15m-11-5h8" fill="none" stroke="#9ef5ce" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="16" y="69" fill="#e2ebe7" font-family="Arial,sans-serif" font-size="16" font-weight="700">rembg · U²-Net</text>
    <text x="16" y="91" fill="#91a3a8" font-family="Arial,sans-serif" font-size="12">Foreground segmentation</text>
    <path d="M16 109H204" stroke="#2d3a42"/>
    <text x="16" y="130" fill="#b9a8ff" font-family="monospace" font-size="10">MODEL LOADS ON DEMAND</text>
  </g>
  <path d="M823 189H862" stroke="#8be6ba" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(872 112)">
    <rect width="220" height="154" rx="12" fill="url(#surface)" stroke="#3d514d"/>
    <rect x="16" y="15" width="31" height="31" rx="8" fill="#20372f" stroke="#46685a"/>
    <rect x="22" y="22" width="19" height="17" rx="2" fill="none" stroke="#9ef5ce" stroke-width="1.5"/><path d="M22 33 28 27l4 4 3-3 6 7" fill="none" stroke="#9ef5ce" stroke-width="1.5"/>
    <text x="16" y="69" fill="#e2ebe7" font-family="Arial,sans-serif" font-size="16" font-weight="700">Pillow + NumPy</text>
    <text x="16" y="91" fill="#91a3a8" font-family="Arial,sans-serif" font-size="12">Composite + inspect alpha</text>
    <path d="M16 109H204" stroke="#2d3a42"/>
    <text x="16" y="130" fill="#9ef5ce" font-family="monospace" font-size="10">TRANSPARENT OR COMPOSITE</text>
  </g>
  <path d="M1101 189H1140" stroke="#8be6ba" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1150 112)">
    <rect width="112" height="154" rx="12" fill="#16251f" stroke="#5d8a73"/>
    <rect x="27" y="21" width="58" height="58" rx="7" fill="#f1f3ef"/>
    <path d="M27 21h29v29H27zm29 29h29v29H56z" fill="#c6cfca"/>
    <text x="56" y="101" text-anchor="middle" fill="#d9f3e5" font-family="Arial,sans-serif" font-size="13" font-weight="700">PNG</text>
    <text x="56" y="119" text-anchor="middle" fill="#8caf9e" font-family="Arial,sans-serif" font-size="10">Response</text>
    <text x="56" y="136" text-anchor="middle" fill="#9ef5ce" font-family="monospace" font-size="9">NO STORE</text>
  </g>
  <g transform="translate(38 306)">
    <rect width="1224" height="76" rx="11" fill="#101a17" stroke="#2d4940"/>
    <circle cx="25" cy="25" r="5" fill="#9ef5ce"/>
    <text x="43" y="29" fill="#d1e9dd" font-family="Arial,sans-serif" font-size="13" font-weight="700">Privacy boundary</text>
    <text x="43" y="49" fill="#8ea59a" font-family="Arial,sans-serif" font-size="11">Images are accepted by the locally running server, processed in memory, and returned as a PNG. The app does not write a gallery or upload files to a third-party service.</text>
    <rect x="1055" y="20" width="145" height="34" rx="6" fill="#1b3028" stroke="#436b58"/>
    <text x="1127" y="41" text-anchor="middle" fill="#9ef5ce" font-family="monospace" font-size="10" letter-spacing="1">LOCAL ONLY</text>
  </g>
  <text x="1260" y="411" text-anchor="end" fill="#536a61" font-family="monospace" font-size="9" letter-spacing="1.2">VERITYAGENT / CUTOUT STUDIO</text>
</svg>