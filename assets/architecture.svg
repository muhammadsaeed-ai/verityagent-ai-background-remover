<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="390" viewBox="0 0 1300 390" role="img" aria-labelledby="title desc">
<title id="title">Cutout Studio processing architecture</title><desc id="desc">The web interface passes uploads to local Flask validation, then rembg/U2-Net, Pillow and NumPy compositing, and returns a PNG. The CLI remains a separate entry point.</desc>
<defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15202a"/><stop offset="1" stop-color="#0e151d"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6Z" fill="#8be6ba"/></marker></defs>
<rect width="1300" height="390" rx="20" fill="#0a0e14"/><path d="M0 66H1300" stroke="#26323b"/><text x="38" y="31" fill="#9ef5ce" font-family="monospace" font-size="10" letter-spacing="2">SYSTEM MAP / 001</text><text x="38" y="51" fill="#dce6e2" font-family="Arial,sans-serif" font-size="17" font-weight="700">Two entry points. One reusable image engine.</text>
<g transform="translate(38 101)"><rect width="210" height="128" rx="12" fill="url(#card)" stroke="#3d514d"/><text x="15" y="28" fill="#9ef5ce" font-family="monospace" font-size="10">01 / PRESENTATION</text><text x="15" y="55" fill="#e2ebe7" font-family="Arial,sans-serif" font-size="16" font-weight="700">Browser studio</text><text x="15" y="76" fill="#91a3a8" font-family="Arial,sans-serif" font-size="11">HTML · CSS · JavaScript</text><path d="M15 92H194" stroke="#2d3a42"/><text x="15" y="111" fill="#9ef5ce" font-family="monospace" font-size="9">UPLOAD · COMPARE · EXPORT</text></g>
<path d="M257 166h34m-8-6 8 6-8 6" stroke="#8be6ba" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g transform="translate(300 101)"><rect width="205" height="128" rx="12" fill="url(#card)" stroke="#3d514d"/><text x="15" y="28" fill="#9ef5ce" font-family="monospace" font-size="10">02 / VALIDATION</text><text x="15" y="55" fill="#e2ebe7" font-family="Arial,sans-serif" font-size="16" font-weight="700">Local Flask API</text><text x="15" y="76" fill="#91a3a8" font-family="Arial,sans-serif" font-size="11">File and request boundary</text><path d="M15 92H190" stroke="#2d3a42"/><text x="15" y="111" fill="#9ef5ce" font-family="monospace" font-size="9">12 MB · 20 MP · FORMAT CHECK</text></g>
<path d="M514 166h34m-8-6 8 6-8 6" stroke="#8be6ba" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g transform="translate(557 101)"><rect width="205" height="128" rx="12" fill="url(#card)" stroke="#3d514d"/><text x="15" y="28" fill="#b9a8ff" font-family="monospace" font-size="10">03 / INFERENCE</text><text x="15" y="55" fill="#e2ebe7" font-family="Arial,sans-serif" font-size="16" font-weight="700">rembg · U²-Net</text><text x="15" y="76" fill="#91a3a8" font-family="Arial,sans-serif" font-size="11">Foreground segmentation</text><path d="M15 92H190" stroke="#2d3a42"/><text x="15" y="111" fill="#b9a8ff" font-family="monospace" font-size="9">LOAD MODEL WHEN NEEDED</text></g>
<path d="M771 166h34m-8-6 8 6-8 6" stroke="#8be6ba" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g transform="translate(814 101)"><rect width="205" height="128" rx="12" fill="url(#card)" stroke="#3d514d"/><text x="15" y="28" fill="#9ef5ce" font-family="monospace" font-size="10">04 / COMPOSITION</text><text x="15" y="55" fill="#e2ebe7" font-family="Arial,sans-serif" font-size="16" font-weight="700">Pillow + NumPy</text><text x="15" y="76" fill="#91a3a8" font-family="Arial,sans-serif" font-size="11">Alpha and background modes</text><path d="M15 92H190" stroke="#2d3a42"/><text x="15" y="111" fill="#9ef5ce" font-family="monospace" font-size="9">TRANSPARENT · COLOR · IMAGE</text></g>
<path d="M1028 166h34m-8-6 8 6-8 6" stroke="#8be6ba" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g transform="translate(1071 101)"><rect width="190" height="128" rx="12" fill="#16251f" stroke="#5d8a73"/><text x="15" y="28" fill="#9ef5ce" font-family="monospace" font-size="10">05 / RESULT</text><rect x="15" y="42" width="38" height="38" rx="4" fill="#f1f3ef"/><path d="M15 42h19v19H15zm19 19h19v19H34z" fill="#c6cfca"/><text x="64" y="57" fill="#e2ebe7" font-family="Arial,sans-serif" font-size="15" font-weight="700">PNG</text><text x="64" y="74" fill="#8caf9e" font-family="Arial,sans-serif" font-size="10">In-memory response</text><path d="M15 92H174" stroke="#2d453a"/><text x="15" y="111" fill="#9ef5ce" font-family="monospace" font-size="9">NO GALLERY OR SAVE</text></g>
<g transform="translate(38 263)"><rect width="1223" height="79" rx="11" fill="#101a17" stroke="#2d4940"/><circle cx="24" cy="24" r="5" fill="#9ef5ce"/><text x="42" y="28" fill="#d1e9dd" font-family="Arial,sans-serif" font-size="13" font-weight="700">Privacy boundary</text><text x="42" y="49" fill="#8ea59a" font-family="Arial,sans-serif" font-size="11">The browser UI runs against the local web server. Uploads are checked, processed in memory, and returned as PNG. The CLI uses the same reusable image functions without needing Flask.</text><rect x="1045" y="20" width="155" height="34" rx="6" fill="#1b3028" stroke="#436b58"/><text x="1122" y="41" text-anchor="middle" fill="#9ef5ce" font-family="monospace" font-size="10" letter-spacing="1">LOCAL BY DEFAULT</text></g>
<text x="1260" y="370" text-anchor="end" fill="#536a61" font-family="monospace" font-size="9" letter-spacing="1.2">VERITYAGENT / CUTOUT STUDIO</text>
</svg>